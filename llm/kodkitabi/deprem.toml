# Kod kitabı: 6 Şubat 2023 depremleri — haber başlığı etiketleme (LLM pilotu)
#
# Aynı kod kitabı hem insan kodlayıcı (llm/kodlama.py) hem LLM istemi için kullanılır; tanımlar değişirse
# `surum` artırılır ve etiketler hangi sürümle üretildiğini saklar. Gerçek kişi adı içermez.
#
# Kurallar (her alan için):
# - Yalnızca başlığa (başlık yoksa adresteki metne) bakılır; haberin içeriği tahmin edilmez.
# - Tek seçim yapılır: başlıkta en baskın olan. Emin olunamıyorsa "karar_verilemedi" işaretlenir.
# - Tarih, site ve yayın çizgisi bilgisi kodlayıcıya gösterilmez (körleme); yalnızca başlık ve dönem.

