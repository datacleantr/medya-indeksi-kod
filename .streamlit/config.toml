# Medya İndeksi teması. Renkler Mercek web panelinin (apps/web/app/globals.css) "basılı dosya"
# dilinden alınmıştır: kâğıt zemin, mürekkep metin, koyu kenar menüsü, kırmızı kalem vurgusu.
[theme]
base = "light"
primaryColor = "#a9473c"
backgroundColor = "#eef2f1"
secondaryBackgroundColor = "#e5ebea"
textColor = "#172126"
linkColor = "#267684"
borderColor = "#d7dfe0"
dataframeBorderColor = "#d7dfe0"
dataframeHeaderBackgroundColor = "#e5ebea"
showWidgetBorder = true
baseRadius = "0.25rem"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap, Avenir Next, Helvetica Neue, sans-serif"
headingFont = "Source Serif 4:https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap, Iowan Old Style, Georgia, serif"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap, SFMono-Regular, Consolas, monospace"
headingFontWeights = [600, 600, 600, 600, 600, 600]
chartCategoricalColors = ["#172126", "#a9473c", "#267684", "#bd7b25", "#16715e", "#616e74", "#6b4c8a", "#c98a7f"]

[theme.sidebar]
backgroundColor = "#172328"
secondaryBackgroundColor = "#243239"
textColor = "#eef2f1"
primaryColor = "#d98b80"
borderColor = "#2f3f46"
linkColor = "#8fc7d1"
