# GDELT'in taramadığı veya taramayı bıraktığı yayınlar için ek toplama (pipeline/extra_collect.py).
# Yalnızca künye toplanır: adres, başlık, tarih. Tam metin toplanmaz. robots.txt'ye uyulur; site başına
# saniyede en fazla bir istek gider. Panelin kapsam denetimi hangi yayınların eksik olduğunu gösterir
# (KEY_OUTLETS); buraya eklenen yayın `site` alanıyla oradaki alan adına bağlanır.
#
# Alanlar:
#   ad              görünen ad
#   site            SourceCommonName karşılığı (www'siz alan adı; KEY_OUTLETS'teki ile aynı)
#   guncel          son haberleri veren RSS veya haber site haritaları (her gün çalıştırılır)
#   arsiv_dizini    geçmiş site haritalarının dizini (isteğe bağlı)
#   arsiv_kalip     dizindeki alt haritaları seçen regex. İki grup varsa (yıl, ay) harita o aya aittir ve
#                   tarih hassasiyeti "ay"dır (lastmod ay içindeyse "gün"). Grup yoksa tarih lastmod'dan
#                   veya url_tarih'ten alınır (WordPress türü; tüm alt haritalar okunur).
#   url_tarih       adresten tarih çıkaran regex (yıl, ay, gün grupları; isteğe bağlı)
#
# Toplanamayanlar (29.09.2026 yoklaması): Mezopotamya Ajansı (robots.txt tüm toplamayı yasaklıyor),
# İHA (RSS/site haritası yok), Bold Medya ve Özgür Gündem (TLS sertifika hatası).

[[yayin]]
ad = "Cumhuriyet"
site = "cumhuriyet.com.tr"
guncel = ["https://www.cumhuriyet.com.tr/sitemaps/news.xml", "https://www.cumhuriyet.com.tr/rss"]
arsiv_dizini = "https://www.cumhuriyet.com.tr/sitemaps/posts.xml"
arsiv_kalip = "posts-(\\d{4})-(\\d{1,2})\\.xml"

